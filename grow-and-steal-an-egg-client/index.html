<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Grow and Steal an Egg</title>
    <link rel="preload" href="./loading/background.jpg" as="image" />
    <link rel="preload" href="./loading/icon.jpg" as="image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Luckiest+Guy&display=swap" rel="stylesheet" />
    <!-- The loading page is drawn by the page itself, so it shows from the very first moment instead of
         an empty screen while the game code downloads. It looks the same as the game's own loading
         page (src/ui/LoadingScreen.jsx, loading.css), which removes this one when it takes over. -->
    <style>
      html, body { margin: 0; height: 100%; background: #0d1a26; }
      #boot {
        position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; overflow: hidden;
        background: #0d1a26; font-family: 'Fredoka', 'Segoe UI', system-ui, sans-serif; color: #fff;
      }
      #boot .b-bg {
        position: absolute; inset: -40px; background: url('./loading/background.jpg') center / cover no-repeat;
        filter: blur(26px) saturate(1.15); transform: scale(1.08);
      }
      #boot .b-shade { position: absolute; inset: 0; background: radial-gradient(circle at center, rgba(10, 20, 32, 0.35), rgba(5, 12, 20, 0.78)); }
      #boot .b-center { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0 16px; text-align: center; }
      #boot .b-icon {
        display: block; width: 150px; height: 150px; margin-bottom: 18px; border-radius: 14px; object-fit: cover;
        border: 4px solid rgba(20, 22, 30, 0.9); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55), 0 0 0 2px rgba(255, 255, 255, 0.08);
        animation: b-bob 2.2s ease-in-out infinite;
      }
      #boot h1 { margin: 0; font-size: clamp(22px, 3.2vw, 34px); font-weight: 700; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6); }
      #boot p { margin: 0; font-size: clamp(14px, 1.8vw, 19px); font-weight: 600; color: #b8c2cc; }
      #boot .b-bar { width: min(340px, 70vw); height: 10px; margin-top: 10px; border-radius: 6px; overflow: hidden; background: rgba(255, 255, 255, 0.12); }
      #boot .b-bar i { display: block; width: 6%; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #5ff04a, #ffd21f); }
      #boot .b-dots { display: flex; gap: 10px; margin-top: 14px; }
      #boot .b-dots i { width: 10px; height: 10px; border-radius: 50%; background: #5a6470; animation: b-dot 1.2s ease-in-out infinite; }
      #boot .b-dots i:nth-child(2) { animation-delay: 0.2s; }
      #boot .b-dots i:nth-child(3) { animation-delay: 0.4s; }
      @keyframes b-bob { 50% { transform: translateY(-8px); } }
      @keyframes b-dot { 40% { background: #c8d0d8; transform: translateY(-4px); } }
      @media (max-height: 480px) { #boot .b-icon { width: 96px; height: 96px; margin-bottom: 8px; } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading Grow and Steal an Egg">
      <div class="b-bg"></div>
      <div class="b-shade"></div>
      <div class="b-center">
        <img class="b-icon" src="./loading/icon.jpg" alt="" width="150" height="150" />
        <h1>Grow and Steal an Egg</h1>
        <p>Loading…</p>
        <div class="b-bar"><i></i></div>
        <div class="b-dots"><i></i><i></i><i></i></div>
      </div>
    </div>
    <div id="root"></div>
    <!-- Boxity SDK (pinned v1): must load before the game code and before any matchmaker request.
         It sits after the loading page so waiting for it never leaves the screen empty. -->
    <script src="https://sdk.bloxity.io/v1/legion-sdk.min.js"></script>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
